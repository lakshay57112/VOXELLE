services:
  - type: web
    name: voxelle
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_TZ
        value: Asia/Kolkata
      - key: GNANI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY_PEM
        sync: false
      - key: VAPID_SUBJECT
        sync: false
